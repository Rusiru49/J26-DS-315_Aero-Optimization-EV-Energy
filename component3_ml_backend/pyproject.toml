[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "component3"
version = "0.1.0"
description = "J26-DS-315 Component 3: physics-grounded drag prediction and cycle-aware shape optimisation for EVs"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
